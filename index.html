<title>Portal SK@S | SK Temin</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f5f6f3; color: #162539; font: 16px/1.5 Inter, system-ui, sans-serif; }
main { width: min(1060px, calc(100% - 2.5rem)); margin: clamp(2rem, 8vw, 6rem) auto; }
header { display: flex; align-items: center; gap: 1rem; margin-bottom: 3rem; }
header img { width: clamp(56px, 10vw, 80px); height: auto; }
header p { margin: 0; color: #485568; font-weight: 600; }
h1 { font-size: clamp(2.1rem, 6vw, 3.5rem); letter-spacing: -.055em; line-height: 1.04; margin: .2rem 0 0; }
nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.card { display: flex; flex-direction: column; min-height: 175px; padding: 1.4rem; border: 1px solid var(--edge); border-radius: 18px; color: var(--ink); background: var(--surface); text-decoration: none; transition: transform .16s, box-shadow .16s; }
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 18px #18283b18; }
.card:focus-visible, summary:focus-visible { outline: 3px solid #162539; outline-offset: 4px; }
.blue { --surface: #e8efff; --edge: #bdcff1; --ink: #203c77; }
.green { --surface: #e2f3eb; --edge: #b9dacb; --ink: #19523e; }
.amber { --surface: #fff0d8; --edge: #edd3a5; --ink: #714515; }
.card h2 { margin: 0; font-size: 1.3rem; letter-spacing: -.025em; line-height: 1.2; }
.card .icon { display: grid; place-items: center; width: 3rem; height: 3rem; margin-bottom: 1rem; border-radius: 14px; background: #ffffffa8; font-size: 1.6rem; }
details { margin-top: 1.5rem; color: #485568; font-size: .9rem; }
summary { width: fit-content; cursor: pointer; font-weight: 650; }
details p { margin: .5rem 0 0; }
@media (max-width: 740px) { nav { grid-template-columns: 1fr; } .card { min-height: 0; } header { margin-bottom: 1.75rem; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
